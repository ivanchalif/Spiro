kind = "web"
previewPath = "/"
title = "Advanced Digital Spirograph"
version = "1.0.0"
id = "artifacts/spirograph"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23285

[services.development]
run = "pnpm --filter @workspace/spirograph run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spirograph", "run", "build" ]
publicDir = "artifacts/spirograph/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23285"
BASE_PATH = "/"
